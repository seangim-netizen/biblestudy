<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>개인용 성경앱</title>
  <link rel="stylesheet" href="style.css?v=301">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="theme-sepia">

  <!-- 앱 헤더 -->
  <header class="app-header">
    <div class="header-row">
      <div class="header-logo-area">
        <img src="header_logo.png?v=2" alt="로그인처치" class="header-logo-img">
      </div>
      <div class="quick-nav-dropdowns">
        <select id="quickBookSelect" class="quick-select"></select>
        <select id="quickChapterSelect" class="quick-select"></select>
      </div>
      <div class="header-player">
        <button id="btnAudioTTSPlay" class="btn-header-player">▶ 재생</button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃: 성경 본문 뷰어 -->
  <main class="app-content">
    <div id="bibleViewer" class="bible-viewer-container"></div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-control-group">
      <button id="btnPrevChapter" class="btn-nav">◀ 이전 장</button>
      <div class="select-wrapper">
        <select id="primaryTranslation">
          <option value="KG" selected>개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <button id="btnNextChapter" class="btn-nav">다음 장 ▶</button>
    </div>
  </nav>

  <!-- 서비스 워커 및 DB 스크립트 -->
  <script src="bible_db_66.js"></script>
  <script src="app.js?v=301"></script>
</body>
</html>
