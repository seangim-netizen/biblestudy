<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>개인용 성경앱</title>
  <link rel="stylesheet" href="style.css?v=9100">
  <link rel="manifest" href="manifest.json?v=9100">
  <link rel="apple-touch-icon" href="app_logo.png?v=9100">
  <link rel="apple-touch-icon" sizes="180x180" href="app_logo.png?v=9100">
  <link rel="apple-touch-icon" sizes="152x152" href="app_logo.png?v=9100">
  <link rel="icon" type="image/png" sizes="32x32" href="app_logo.png?v=9100">
  <link rel="icon" type="image/png" sizes="16x16" href="app_logo.png?v=9100">
  <meta name="apple-mobile-web-app-title" content="성경앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    (function() {
      var t = localStorage.getItem("bible_app_theme");
      if (t === "dark") {
        document.documentElement.classList.add("theme-dark");
      }
    })();
  </script>
</head>
<body class="theme-sepia">

  <!-- 앱 헤더 (재생/정지 글씨 삭제) -->
  <header class="app-header">
    <div class="header-row">
      <div class="header-logo-area">
        <img src="header_logo.png?v=9100" alt="LivingBreath" class="header-logo-img">
      </div>
      <div class="quick-nav-dropdowns">
        <select id="quickBookSelect" class="quick-select"></select>
        <select id="quickChapterSelect" class="quick-select"></select>
      </div>
      <div class="header-actions">
        <button id="btnOpenSearch" class="btn-header-icon" title="성경 검색">🔍</button>
        <button id="btnAudioTTSPlay" class="btn-header-player-icon" title="음성 낭독 재생">▶</button>
        <button id="btnOpenSettings" class="btn-header-icon" title="설정">⚙️</button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃: 성경 본문 뷰어 및 각 장 하단 읽음 완료 체크 버튼 -->
  <main class="app-content">
    <div id="bibleViewer" class="bible-viewer-container"></div>
    
    <!-- 성경 각 장 하단에 위치하는 완독 체크 버튼 -->
    <div class="chapter-footer-read-area">
      <button id="btnBottomToggleRead" class="btn-chapter-bottom-read">
        <span class="read-icon">✓</span> <span id="bottomReadText">이 장 읽음 완료 표시</span>
      </button>
    </div>
  </main>

  <!-- 하단 음성 플레이어 컨트롤 박스 (재생 중일 때만 시각적 표시) -->
  <div id="ttsPlayerBox" class="tts-player-box hidden">
    <div class="tts-player-row1">
      <button id="btnAudioTTSPrev" class="tts-ctrl-btn">⏮ 이전</button>
      <button id="btnAudioTTSPlay2" class="tts-ctrl-btn tts-play-btn">❚❚</button>
      <button id="btnAudioTTSNext" class="tts-ctrl-btn">다음 ⏭</button>
    </div>
    <div class="tts-player-row2">
      <button id="btnTTSSpeed" class="tts-sub-btn">🐢 1.0x</button>
      <button id="btnTTSRepeat" class="tts-sub-btn">🔄 연속</button>
      <button id="btnAudioTTSStop" class="tts-sub-btn btn-stop">■ 정지</button>
    </div>
  </div>

  <!-- 통합 설정 & 성경 통독표/통독계획 모달 -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 설정 & 성경 통독</h3>
        <button id="btnCloseSettings" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        
        <!-- 1. 성경 통독 현황 요약 및 66권 격자 펼치기 버튼 -->
        <div class="setting-section">
          <div class="setting-section-title">📊 성경 66권 통독 현황</div>
          <div class="progress-dashboard">
            <div class="progress-summary">
              <span>전체 1,189장 중 <strong id="completedChaptersCount">0</strong>장 읽음</span>
              <span id="progressPercentage" class="progress-percentage">0.0%</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
          </div>
          <!-- 누르면 읽은 장 격자 박스가 펼쳐지는 아코디언 버튼 -->
          <button id="btnToggleBoardGrid" class="btn-toggle-board">
            <span>📖 성경 66권 읽은 장 격자표 보기</span> <span id="boardAccordionArrow">▼</span>
          </button>
          
          <div id="boardGridWrapper" class="board-grid-wrapper hidden">
            <div id="settingsBoardGrid" class="settings-board-grid">
              <!-- 성경 66권 장별 박스 (음영 식별 격자) -->
            </div>
          </div>
        </div>

        <!-- 2. 화면 테마 & 글자 크기 -->
        <div class="setting-section">
          <div class="setting-section-title">🎨 화면 및 폰트 설정</div>
          <div class="setting-item">
            <label class="setting-label">화면 테마 모드</label>
            <div class="theme-options">
              <button id="btnThemeSepia" class="theme-btn active">☀️ 맑게 (세피아)</button>
              <button id="btnThemeDark" class="theme-btn">🌙 어둡게 (다크)</button>
            </div>
          </div>
          <div class="setting-item" style="margin-top:12px;">
            <label class="setting-label">글자 크기 조절</label>
            <div class="font-controls-row">
              <button id="btnModalFontDec" class="btn-setting-font">가- (작게)</button>
              <span id="fontRatioLabel" class="font-ratio-display">1.1x</span>
              <button id="btnModalFontInc" class="btn-setting-font">가+ (크게)</button>
            </div>
          </div>
        </div>

        <!-- 4. 통독 기록 초기화 -->
        <div class="setting-section" style="margin-top:10px; border-bottom:none;">
          <button id="btnResetHistory" class="btn-reset-danger">🗑️ 통독 기록 초기화</button>
        </div>

      </div>
    </div>
  </div>

  <!-- 더블클릭 성경 구절 메모 작성 모달 -->
  <div id="noteModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="noteModalTitle">📝 구절 메모 작성</h3>
        <button id="btnCloseNote" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div id="noteVersePreview" class="note-verse-preview"></div>
        <textarea id="noteInputText" class="note-textarea" placeholder="이 말씀 구절에 대한 묵상이나 메모를 기록하세요..."></textarea>
        <div class="note-modal-actions">
          <button id="btnDeleteNote" class="btn-note-delete hidden">🗑️ 메모 삭제</button>
          <button id="btnSaveNote" class="btn-note-save">💾 메모 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 성경 검색 모달 -->
  <div id="searchModal" class="modal-overlay hidden">
    <div class="modal-content search-modal-content">
      <div class="modal-header">
        <h3>🔍 성경 본문 검색</h3>
        <button id="btnCloseSearch" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body search-modal-body">
        <div class="search-input-box">
          <input type="text" id="searchInput" placeholder="검색할 단어나 구절을 입력하세요 (예: 사랑, 믿음)..." autocomplete="off" />
          <button id="btnExecuteSearch" class="btn-search-exec">검색</button>
        </div>
        <div id="searchResultSummary" class="search-result-summary">검색어를 입력하고 검색 버튼을 누르세요.</div>
        <div id="searchResultsList" class="search-results-list"></div>
      </div>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-control-group">
      <button id="btnPrevChapter" class="btn-arrow-nav">◀</button>
      <div class="select-wrapper">
        <select id="primaryTranslation">
          <option value="KG" selected>개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <span class="vs-label">vs</span>
      <div class="select-wrapper">
        <select id="secondaryTranslation">
          <option value="NONE" selected>대조 없음</option>
          <option value="KG">개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <button id="btnNextChapter" class="btn-arrow-nav">▶</button>
    </div>
  </nav>

  <!-- 서비스 워커 및 DB 스크립트 -->
  <script src="bible_db_66.js?v=9100"></script>
  <script src="app.js?v=9100"></script>

  <!-- 백그라운드 재생 및 잠금화면 유지용 무음 WAV 오디오 (개인통독앱과 100% 동일 사양) -->
  <audio id="bgSilentAudio" loop preload="auto" src="data:audio/wav;base64,UklGRqQ+AABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YYA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
