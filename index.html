<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>개인용 성경앱</title>
  <link rel="stylesheet" href="style.css?v=1300">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="theme-sepia">

  <!-- 앱 헤더 -->
  <header class="app-header">
    <div class="header-row">
      <div class="header-logo-area">
        <img src="header_logo.png?v=1300" alt="로그인처치" class="header-logo-img">
      </div>
      <div class="quick-nav-dropdowns">
        <select id="quickBookSelect" class="quick-select"></select>
        <select id="quickChapterSelect" class="quick-select"></select>
      </div>
      <div class="header-controls">
        <button id="btnOpenPlan" class="btn-header-plan">📅 통독</button>
        <button id="btnOpenSettings" class="btn-header-icon" title="설정">⚙️</button>
        <button id="btnAudioTTSPlay" class="btn-header-player">▶ 재생</button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃: 성경 본문 뷰어 -->
  <main class="app-content">
    <div id="bibleViewer" class="bible-viewer-container"></div>
  </main>

  <!-- 하단 음성 플레이어 컨트롤 박스 (재생 시 자동 표시) -->
  <div id="ttsPlayerBox" class="tts-player-box hidden">
    <div class="tts-player-row1">
      <button id="btnAudioTTSPrev" class="tts-ctrl-btn">⏮ 이전</button>
      <button id="btnAudioTTSPlay2" class="tts-ctrl-btn tts-play-btn">❚❚ 일시정지</button>
      <button id="btnAudioTTSNext" class="tts-ctrl-btn">다음 ⏭</button>
    </div>
    <div class="tts-player-row2">
      <button id="btnTTSSpeed" class="tts-sub-btn">🐢 1.0x</button>
      <button id="btnTTSRepeat" class="tts-sub-btn">🔄 연속</button>
      <button id="btnAudioTTSStop" class="tts-sub-btn btn-stop">■ 정지</button>
    </div>
  </div>

  <!-- 통독 계획 모달 -->
  <div id="planModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📅 성경 통독 계획</h3>
        <button id="btnClosePlan" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="plan-tabs">
          <button id="tabMcheyne" class="plan-tab active">맥체인 통독</button>
          <button id="tabYearOne" class="plan-tab">1년 1독</button>
          <button id="tabCustom" class="plan-tab">개인 설정</button>
        </div>
        <div id="planTabContent" class="plan-tab-content">
          <!-- 탭 콘텐츠 동적 생성 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 설정 모달 (글씨크기 및 맑게/어둡게 화면모드) -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 화면 및 폰트 설정</h3>
        <button id="btnCloseSettings" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label class="setting-label">화면 테마 모드</label>
          <div class="theme-options">
            <button id="btnThemeSepia" class="theme-btn active">☀️ 맑게 (세피아)</button>
            <button id="btnThemeDark" class="theme-btn">🌙 어둡게 (다크)</button>
          </div>
        </div>
        <div class="setting-item">
          <label class="setting-label">글자 크기 조절</label>
          <div class="font-controls-row">
            <button id="btnModalFontDec" class="btn-setting-font">가- (작게)</button>
            <span id="fontRatioLabel" class="font-ratio-display">1.1x</span>
            <button id="btnModalFontInc" class="btn-setting-font">가+ (크게)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-control-group">
      <button id="btnPrevChapter" class="btn-arrow-nav">◀</button>
      <div class="select-wrapper">
        <select id="primaryTranslation">
          <option value="KG" selected>개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <span class="vs-label">vs</span>
      <div class="select-wrapper">
        <select id="secondaryTranslation">
          <option value="NONE" selected>대조 없음</option>
          <option value="KG">개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <button id="btnNextChapter" class="btn-arrow-nav">▶</button>
    </div>
  </nav>

  <!-- 서비스 워커 및 DB 스크립트 -->
  <script src="bible_db_66.js"></script>
  <script src="app.js?v=1300"></script>

</body>
</html>
