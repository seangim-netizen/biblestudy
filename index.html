<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>개인용 성경앱</title>
  <link rel="stylesheet" href="style.css?v=1500">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="theme-sepia">

  <!-- 간단해진 앱 헤더 (읽음표시 제외, 뷰어 위주) -->
  <header class="app-header">
    <div class="header-row">
      <div class="header-logo-area">
        <img src="header_logo.png?v=1500" alt="로그인처치" class="header-logo-img">
      </div>
      <div class="quick-nav-dropdowns">
        <select id="quickBookSelect" class="quick-select"></select>
        <select id="quickChapterSelect" class="quick-select"></select>
      </div>
      <div class="header-actions">
        <button id="btnOpenBoardTab" class="btn-header-plan" title="성경 66권 통독표">📊 통독표</button>
        <button id="btnAudioTTSPlay" class="btn-header-player">▶ 재생</button>
        <button id="btnOpenSettings" class="btn-header-icon" title="설정">⚙️</button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃: 성경 본문 뷰어 및 하부 읽음 버튼 -->
  <main class="app-content">
    <div id="bibleViewer" class="bible-viewer-container"></div>
    
    <!-- 각 장마다 하단(본문 끝)에 배치되는 읽음 체크 버튼 -->
    <div class="chapter-footer-read-area">
      <button id="btnBottomToggleRead" class="btn-chapter-bottom-read">
        <span class="read-icon">✓</span> <span id="bottomReadText">이 장 읽음 완료 표시</span>
      </button>
    </div>
  </main>

  <!-- 66권 성경 통독표 전용 페이지 탭 (전체 화면 메인 탭 뷰) -->
  <div id="boardPageTab" class="page-tab-overlay hidden">
    <div class="page-tab-container">
      <div class="page-tab-header">
        <div class="page-tab-title">
          <h2>📊 성경 66권 통독 현황표</h2>
          <p id="boardTabSubtitle">전체 1,189장 중 0장 (0.0%) 완독</p>
        </div>
        <button id="btnCloseBoardTab" class="btn-close-page-tab">✕ 닫기</button>
      </div>
      <div class="page-tab-progress-wrap">
        <div class="progress-bar-bg">
          <div id="boardProgressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
      <div class="page-tab-body">
        <div id="boardGridContainer" class="board-grid-container">
          <!-- 66권 전체 그리드 방 동적 렌더링 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 하단 음성 플레이어 컨트롤 박스 (재생 시 자동 표시) -->
  <div id="ttsPlayerBox" class="tts-player-box hidden">
    <div class="tts-player-row1">
      <button id="btnAudioTTSPrev" class="tts-ctrl-btn">⏮ 이전</button>
      <button id="btnAudioTTSPlay2" class="tts-ctrl-btn tts-play-btn">❚❚ 일시정지</button>
      <button id="btnAudioTTSNext" class="tts-ctrl-btn">다음 ⏭</button>
    </div>
    <div class="tts-player-row2">
      <button id="btnTTSSpeed" class="tts-sub-btn">🐢 1.0x</button>
      <button id="btnTTSRepeat" class="tts-sub-btn">🔄 연속</button>
      <button id="btnAudioTTSStop" class="tts-sub-btn btn-stop">■ 정지</button>
    </div>
  </div>

  <!-- 설정 모달 (화면 모드 및 폰트 크기) -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 화면 및 폰트 설정</h3>
        <button id="btnCloseSettings" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label class="setting-label">화면 테마 모드</label>
          <div class="theme-options">
            <button id="btnThemeSepia" class="theme-btn active">☀️ 맑게 (세피아)</button>
            <button id="btnThemeDark" class="theme-btn">🌙 어둡게 (다크)</button>
          </div>
        </div>
        <div class="setting-item" style="margin-top:10px;">
          <label class="setting-label">글자 크기 조절</label>
          <div class="font-controls-row">
            <button id="btnModalFontDec" class="btn-setting-font">가- (작게)</button>
            <span id="fontRatioLabel" class="font-ratio-display">1.1x</span>
            <button id="btnModalFontInc" class="btn-setting-font">가+ (크게)</button>
          </div>
        </div>
        <div class="setting-section" style="margin-top:15px; border-bottom:none;">
          <button id="btnResetHistory" class="btn-reset-danger">🗑️ 통독 기록 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-control-group">
      <button id="btnPrevChapter" class="btn-arrow-nav">◀</button>
      <div class="select-wrapper">
        <select id="primaryTranslation">
          <option value="KG" selected>개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <span class="vs-label">vs</span>
      <div class="select-wrapper">
        <select id="secondaryTranslation">
          <option value="NONE" selected>대조 없음</option>
          <option value="KG">개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <button id="btnNextChapter" class="btn-arrow-nav">▶</button>
    </div>
  </nav>

  <!-- 서비스 워커 및 DB 스크립트 -->
  <script src="bible_db_66.js"></script>
  <script src="app.js?v=1500"></script>

  <!-- 백그라운드 재생 및 잠금화면 유지용 무음 MP3 오디오 (iOS 최적화) -->
  <audio id="bgSilentAudio" loop preload="auto" src="data:audio/mpeg;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//5DAAAAAAAAAAAAAFhpbmcAAAAPAAAAUAAADnAAMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAw//5MYxAEAEAAAAUAAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//5MYxAYACAAABQBkAAANVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//5MYxBwACAAABQBkAAANVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"></audio>
</body>
</html>
