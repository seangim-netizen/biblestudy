<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>개인용 성경앱</title>
  <link rel="stylesheet" href="style.css?v=1100">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="theme-sepia">

  <!-- 앱 헤더 -->
  <header class="app-header">
    <div class="header-row">
      <div class="header-logo-area">
        <img src="header_logo.png?v=2" alt="로그인처치" class="header-logo-img">
      </div>
      <div class="quick-nav-dropdowns">
        <select id="quickBookSelect" class="quick-select"></select>
        <select id="quickChapterSelect" class="quick-select"></select>
      </div>
      <div class="header-controls">
        <button id="btnFontDec" class="btn-tool" title="글자 작게">가-</button>
        <button id="btnFontInc" class="btn-tool" title="글자 크게">가+</button>
        <button id="btnThemeToggle" class="btn-tool" title="테마 변경">☀️</button>
        <button id="btnAudioTTSPlay" class="btn-header-player">▶ 재생</button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃: 성경 본문 뷰어 -->
  <main class="app-content">
    <div id="bibleViewer" class="bible-viewer-container"></div>
  </main>

  <!-- 하단 음성 플레이어 컨트롤 박스 (재생 시 자동 표시) -->
  <div id="ttsPlayerBox" class="tts-player-box hidden">
    <div class="tts-player-row1">
      <button id="btnAudioTTSPrev" class="tts-ctrl-btn">⏮ 이전</button>
      <button id="btnAudioTTSPlay2" class="tts-ctrl-btn tts-play-btn">❚❚ 일시정지</button>
      <button id="btnAudioTTSNext" class="tts-ctrl-btn">다음 ⏭</button>
    </div>
    <div class="tts-player-row2">
      <button id="btnTTSSpeed" class="tts-sub-btn">🐢 1.0x</button>
      <button id="btnTTSRepeat" class="tts-sub-btn">🔄 연속</button>
      <button id="btnAudioTTSStop" class="tts-sub-btn btn-stop">■ 정지</button>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-control-group">
      <button id="btnPrevChapter" class="btn-arrow-nav">◀</button>
      <div class="select-wrapper">
        <select id="primaryTranslation">
          <option value="KG" selected>개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <span class="vs-label">vs</span>
      <div class="select-wrapper">
        <select id="secondaryTranslation">
          <option value="NONE" selected>대조 없음</option>
          <option value="KG">개역개정</option>
          <option value="SB">새번역</option>
          <option value="EASY">쉬운성경</option>
          <option value="HYUNDAI">현대인의 성경</option>
          <option value="NIV">NIV (영어)</option>
          <option value="NLT">NLT (영어)</option>
          <option value="NKJV">NKJV (영어)</option>
          <option value="RSV">RSV (영어)</option>
        </select>
      </div>
      <button id="btnNextChapter" class="btn-arrow-nav">▶</button>
    </div>
  </nav>

  <!-- 서비스 워커 및 DB 스크립트 -->
  <script src="bible_db_66.js"></script>
  <script src="app.js?v=1100"></script>

  <!-- 백그라운드 재생 및 잠금화면 유지용 무음 MP3 오디오 (iOS 최적화) -->
  <audio id="bgSilentAudio" loop preload="auto" src="data:audio/mpeg;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//5DAAAAAAAAAAAAAFhpbmcAAAAPAAAAUAAADnAAMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAw//5MYxAEAEAAAAUAAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//5MYxAYACAAABQBkAAANVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//5MYxBwACAAABQBkAAANVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"></audio>
</body>
</html>
